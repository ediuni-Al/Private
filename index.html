<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f6f8fa;
            color: #57606a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #24292f;
            margin-bottom: 16px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
            opacity: 0.3;
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            color: #8c959f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Under Construction</h1>
        <p>このページは現在準備中です。</p>
        <p>This page is currently under construction.</p>
    </div>
    <footer>© 2026</footer>
</body>
</html>
